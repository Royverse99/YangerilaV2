<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Yangerila – Blog</title>

  <!-- Reuse your site look -->
  <link rel="stylesheet" href="../login/style.css?v=7"/>

  <style>
    body { margin: 0; padding: 0; }
    
    /* Hero Section */
    .hero-section {
      background: linear-gradient(135deg, rgba(122,231,199,0.1) 0%, rgba(53,203,187,0.05) 100%);
      border-bottom: 1px solid var(--border);
      padding: 80px 20px 60px;
      text-align: center;
    }

    .hero-section .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 16px;
      object-fit: contain;
    }

    .hero-section h1 {
      font-size: clamp(42px, 6vw, 64px);
      font-weight: 800;
      margin: 0 0 16px;
      background: linear-gradient(135deg, var(--accent), #5dd9a8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-section p {
      font-size: clamp(16px, 2vw, 20px);
      color: var(--muted);
      max-width: 600px;
      margin: 0 auto;
    }

    /* Container */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Filter Bar */
    .filter-bar {
      position: sticky;
      top: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 20px 0;
      z-index: 100;
      backdrop-filter: blur(10px);
      background: rgba(10, 23, 24, 0.95);
    }

    .filter-controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-size: 14px;
      transition: all 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(122, 231, 199, .15);
      background: rgba(255,255,255,.08);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .sort-select {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sort-select:hover {
      border-color: var(--accent);
      background: rgba(255,255,255,.08);
    }

    .view-toggle {
      display: flex;
      gap: 4px;
      background: rgba(255,255,255,.05);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .view-btn {
      padding: 8px 16px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .view-btn.active {
      background: var(--accent);
      color: #0a1718;
    }

    .clear-btn {
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: rgba(255,255,255,.05);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Tags Bar */
    .tags-bar {
      padding: 24px 0;
    }

    .tags-container {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tag-chip {
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 24px;
      cursor: pointer;
      background: rgba(122,231,199,0.1);
      border: 1px solid rgba(122,231,199,0.25);
      color: var(--accent);
      transition: all 0.2s;
    }

    .tag-chip:hover {
      background: rgba(122,231,199,0.15);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(122,231,199,0.2);
    }

    .tag-chip.active {
      background: var(--accent);
      color: #0a1718;
      border-color: var(--accent);
      box-shadow: 0 4px 12px rgba(122,231,199,0.3);
    }

    /* Stats Bar */
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .stats-info {
      font-size: 14px;
      color: var(--muted);
    }

    .stats-info strong {
      color: var(--accent);
      font-weight: 700;
    }

    /* Grid Layouts */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px;
      margin-bottom: 48px;
    }

    .list-view {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 48px;
    }

    /* Card Styles */
    .blog-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.3s;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }

    .blog-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      border-color: rgba(122,231,199,0.4);
    }

    .blog-card.list-card {
      flex-direction: row;
    }

    .card-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
      background: rgba(255,255,255,0.03);
    }

    .list-card .card-image {
      width: 280px;
      height: auto;
      min-height: 200px;
    }

    .card-content {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 22px;
      font-weight: 700;
      margin: 0 0 12px;
      color: var(--text);
      line-height: 1.3;
    }

    .card-meta {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-excerpt {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin: 0 0 16px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .card-tag {
      font-size: 11px;
      background: rgba(122,231,199,0.12);
      border: 1px solid rgba(122,231,199,0.25);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--accent);
    }

    .card-footer {
      display: flex;
      gap: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .card-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
    }

    .card-btn.primary {
      background: var(--accent);
      color: #0a1718;
    }

    .card-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .card-btn:hover {
      transform: translateY(-2px);
    }

    /* Featured Post */
    .featured-post {
      background: var(--panel);
      border: 2px solid var(--accent);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 48px;
      box-shadow: 0 8px 32px rgba(122,231,199,0.15);
      position: relative;
    }

    .featured-badge {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--accent);
      color: #0a1718;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      z-index: 10;
    }

    .featured-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    .featured-image {
      width: 100%;
      height: 100%;
      min-height: 400px;
      object-fit: cover;
    }

    .featured-info {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .featured-title {
      font-size: 36px;
      font-weight: 800;
      margin: 0 0 16px;
      color: var(--text);
      line-height: 1.2;
    }

    .featured-excerpt {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    /* Load More */
    .load-more {
      display: block;
      margin: 0 auto 48px;
      padding: 16px 40px;
      font-size: 15px;
      font-weight: 700;
      background: var(--accent);
      color: #0a1718;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .load-more:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(122,231,199,0.4);
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      max-width: 900px;
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-header {
      position: sticky;
      top: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .modal-close {
      padding: 8px 16px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: rgba(255,255,255,0.1);
      color: var(--text);
    }

    .modal-body {
      padding: 32px;
    }

    .modal-title {
      font-size: 36px;
      font-weight: 800;
      margin: 0 0 20px;
      color: var(--text);
      line-height: 1.2;
    }

    .modal-image {
      width: 100%;
      max-height: 450px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .modal-article {
      color: var(--text);
      line-height: 1.8;
      font-size: 17px;
    }

    .modal-article p {
      margin: 0 0 20px;
    }

    .modal-article h1,
    .modal-article h2,
    .modal-article h3 {
      color: var(--text);
      margin-top: 32px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .modal-article h1 { font-size: 32px; }
    .modal-article h2 { font-size: 26px; }
    .modal-article h3 { font-size: 20px; }

    .modal-article a {
      color: var(--accent);
      text-decoration: underline;
    }

    .modal-article blockquote {
      border-left: 4px solid var(--accent);
      padding-left: 20px;
      margin: 24px 0;
      color: var(--muted);
      font-style: italic;
    }

    .modal-article code {
      background: rgba(255,255,255,0.1);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }

    .modal-article pre {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
      overflow-x: auto;
      border: 1px solid var(--border);
      margin: 24px 0;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .action-btn {
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
    }

    .action-btn.primary {
      background: var(--accent);
      color: #0a1718;
    }

    .action-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.3;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 16px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.9);
      color: #fff;
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 2000;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .featured-content {
        grid-template-columns: 1fr;
      }

      .featured-info {
        padding: 32px;
      }

      .list-card {
        flex-direction: column;
      }

      .list-card .card-image {
        width: 100%;
        height: 220px;
      }
    }

    @media (max-width: 768px) {
      .hero-section {
        padding: 60px 20px 40px;
      }

      .filter-controls {
        flex-direction: column;
      }

      .search-box {
        width: 100%;
      }

      .grid-view {
        grid-template-columns: 1fr;
      }

      .featured-title {
        font-size: 28px;
      }

      .modal-title {
        font-size: 28px;
      }

      .modal-body {
        padding: 24px;
      }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(122,231,199,0.2);
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(122,231,199,0.3);
    }
  </style>
</head>
<body>
  <!-- Hero Section -->
  <section class="hero-section">
    <img src="../v2/wp-content/uploads/2022/04/your-logo-file-name.png" class="logo" alt="Yangerila"/>
    <h1>Blog</h1>
    <p>Discover lessons, tips, and stories from Yangerila</p>
  </section>

  <!-- Filter Bar -->
  <div class="filter-bar">
    <div class="filter-controls">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input id="searchInput" placeholder="Search posts by title or content..."/>
      </div>
      <select class="sort-select" id="sortSelect">
        <option value="date_desc">Newest First</option>
        <option value="date_asc">Oldest First</option>
        <option value="views_desc">Most Viewed</option>
        <option value="likes_desc">Most Liked</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active" data-view="grid">Grid</button>
        <button class="view-btn" data-view="list">List</button>
      </div>
      <button class="clear-btn" id="clearBtn">Clear Filters</button>
    </div>
  </div>

  <main class="container">
    <!-- Tags Bar -->
    <section class="tags-bar">
      <div class="tags-container" id="tagsContainer"></div>
    </section>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stats-info">
        Showing <strong id="postCount">0</strong> posts
      </div>
    </div>

    <!-- Featured Post -->
    <div id="featuredContainer"></div>

    <!-- Posts Grid/List -->
    <div id="postsContainer" class="grid-view"></div>

    <!-- Load More -->
    <button class="load-more" id="loadMoreBtn" style="display:none">Load More Posts</button>
  </main>

  <!-- Modal -->
  <div class="modal" id="postModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle"></h2>
        <button class="modal-close" id="modalClose">Close</button>
      </div>
      <div class="modal-body">
        <div class="card-meta" id="modalMeta"></div>
        <img id="modalImage" class="modal-image" style="display:none"/>
        <div class="card-tags" id="modalTags"></div>
        <article class="modal-article" id="modalContent"></article>
        <div class="modal-actions">
          <button class="action-btn primary" id="modalLikeBtn">
            <span>👍</span>
            <span id="modalLikes">0</span>
            <span>Likes</span>
          </button>
          <button class="action-btn secondary" id="modalShareBtn">
            <span>🔗</span>
            <span>Share</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import {
      getFirestore, collection, query, where, orderBy, limit, getDocs, startAfter,
      doc, updateDoc, increment
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDHDJHrnQ2IwvetQoV6cWAGnkMzANerVDE",
      authDomain: "yangerila-studio.firebaseapp.com",
      projectId: "yangerila-studio",
      storageBucket: "yangerila-studio.appspot.com",
      messagingSenderId: "585529190595",
      appId: "1:585529190595:web:755d5834949c3b30f9a76",
      measurementId: "G-39S837X9BB"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // State
    let state = {
      posts: [],
      filteredPosts: [],
      displayedPosts: [],
      selectedTag: null,
      searchQuery: '',
      sortBy: 'date_desc',
      viewMode: 'grid',
      pageSize: 12,
      currentPage: 1
    };

    // DOM Elements
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const clearBtn = document.getElementById('clearBtn');
    const tagsContainer = document.getElementById('tagsContainer');
    const postsContainer = document.getElementById('postsContainer');
    const featuredContainer = document.getElementById('featuredContainer');
    const postCountEl = document.getElementById('postCount');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const postModal = document.getElementById('postModal');
    const modalClose = document.getElementById('modalClose');
    const toast = document.getElementById('toast');

    // Init
    loadPosts();
    setupEventListeners();

    function setupEventListeners() {
      searchInput.addEventListener('input', handleSearch);
      sortSelect.addEventListener('change', handleSort);
      clearBtn.addEventListener('click', clearFilters);
      modalClose.addEventListener('click', closeModal);
      postModal.addEventListener('click', (e) => {
        if (e.target === postModal) closeModal();
      });
      loadMoreBtn.addEventListener('click', loadMorePosts);

      // View toggle
      document.querySelectorAll('.view-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.viewMode = btn.dataset.view;
          renderPosts();
        });
      });
    }

    async function loadPosts() {
      postsContainer.innerHTML = '<div class="loading">Loading posts...</div>';
      try {
        const q = query(
          collection(db, 'blogs'),
          where('published', '==', true),
          orderBy('publishedAt', 'desc')
        );
        const snapshot = await getDocs(q);
        
        state.posts = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          state.posts.push({
            id: doc.id,
            ...data,
            views: Number(data.views || 0),
            likes: Number(data.likes || 0)
          });
        });

        state.filteredPosts = [...state.posts];
        buildTagsBar();
        renderFeaturedPost();
        applyFilters();
      } catch (error) {
        console.error('Error loading posts:', error);
        postsContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>Failed to load posts</p></div>';
      }
    }

    function buildTagsBar() {
      const tagCounts = new Map();
      state.posts.forEach(post => {
        (post.tags || []).forEach(tag => {
          tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1);
        });
      });

      const topTags = Array.from(tagCounts.entries())
        .sort((a, b) => b[1] - a[1])
        .slice(0, 15);

      const html = [
        `<div class="tag-chip ${!state.selectedTag ? 'active' : ''}" data-tag="">All Posts (${state.posts.length})</div>`,
        ...topTags.map(([tag, count]) => 
          `<div class="tag-chip ${state.selectedTag === tag ? 'active' : ''}" data-tag="${esc(tag)}">${esc(tag)} (${count})</div>`
        )
      ].join('');

      tagsContainer.innerHTML = html;

      tagsContainer.querySelectorAll('.tag-chip').forEach(chip => {
        chip.addEventListener('click', () => {
          const tag = chip.dataset.tag;
          state.selectedTag = tag || null;
          state.currentPage = 1;
          applyFilters();
          updateTagsActive();
        });
      });
    }

    function updateTagsActive() {
      tagsContainer.querySelectorAll('.tag-chip').forEach(chip => {
        const tag = chip.dataset.tag || null;
        chip.classList.toggle('active', tag === state.selectedTag);
      });
    }

    function renderFeaturedPost() {
      if (state.posts.length === 0) return;
      
      const featured = state.posts[0];
      const html = `
        <div class="featured-post" onclick="openPost('${featured.id}')">
          <div class="featured-badge">Featured</div>
          <div class="featured-content">
            ${featured.imageUrl ? `<img src="${esc(featured.imageUrl)}" class="featured-image" alt="${esc(featured.title)}"/>` : ''}
            <div class="featured-info">
              <h2 class="featured-title">${esc(featured.title || 'Untitled')}</h2>
              <div class="card-meta">
                <div class="meta-item">📅 ${formatDate(featured.publishedAt)}</div>
                <div class="meta-item">👁️ ${featured.views} views</div>
                <div class="meta-item">👍 ${featured.likes} likes</div>
              </div>
              <p class="featured-excerpt">${esc(truncate(featured.shortText || '', 200))}</p>
              <div class="card-tags">
                ${(featured.tags || []).map(t => `<span class="card-tag">${esc(t)}</span>`).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
      featuredContainer.innerHTML = html;
    }

    function handleSearch() {
      state.searchQuery = searchInput.value.trim().toLowerCase();
      state.currentPage = 1;
      applyFilters();
    }

    function handleSort() {
      state.sortBy = sortSelect.value;
      applyFilters();
    }

    function clearFilters() {
      state.selectedTag = null;
      state.searchQuery = '';
      state.sortBy = 'date_desc';
      searchInput.value = '';
      sortSelect.value = 'date_desc';
      state.currentPage = 1;
      updateTagsActive();
      applyFilters();
    }

    function applyFilters() {
      let filtered = [...state.posts];

      // Filter by tag
      if (state.selectedTag) {
        filtered = filtered.filter(post => 
          (post.tags || []).includes(state.selectedTag)
        );
      }

      // Filter by search
      if (state.searchQuery) {
        filtered = filtered.filter(post =>
          (post.title || '').toLowerCase().includes(state.searchQuery) ||
          (post.shortText || '').toLowerCase().includes(state.searchQuery)
        );
      }

      // Sort
      filtered.sort((a, b) => {
        switch (state.sortBy) {
          case 'date_desc':
            return getTimestamp(b.publishedAt) - getTimestamp(a.publishedAt);
          case 'date_asc':
            return getTimestamp(a.publishedAt) - getTimestamp(b.publishedAt);
          case 'views_desc':
            return b.views - a.views;
          case 'likes_desc':
            return b.likes - a.likes;
          default:
            return 0;
        }
      });

      state.filteredPosts = filtered;
      state.currentPage = 1;
      renderPosts();
    }

    function renderPosts() {
      const startIdx = 0;
      const endIdx = state.currentPage * state.pageSize;
      state.displayedPosts = state.filteredPosts.slice(startIdx, endIdx);

      postCountEl.textContent = state.filteredPosts.length;

      if (state.displayedPosts.length === 0) {
        postsContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><p>No posts found</p></div>';
        loadMoreBtn.style.display = 'none';
        return;
      }

      postsContainer.className = state.viewMode === 'grid' ? 'grid-view' : 'list-view';
      
      const html = state.displayedPosts.map(post => {
        const cardClass = state.viewMode === 'list' ? 'blog-card list-card' : 'blog-card';
        return `
          <article class="${cardClass}" onclick="openPost('${post.id}')">
            ${post.imageUrl ? `<img src="${esc(post.imageUrl)}" class="card-image" alt="${esc(post.title)}"/>` : ''}
            <div class="card-content">
              <h3 class="card-title">${esc(post.title || 'Untitled')}</h3>
              <div class="card-meta">
                <div class="meta-item">📅 ${formatDate(post.publishedAt)}</div>
                <div class="meta-item">👁️ ${post.views}</div>
                <div class="meta-item">👍 ${post.likes}</div>
              </div>
              <p class="card-excerpt">${esc(post.shortText || '')}</p>
              <div class="card-tags">
                ${(post.tags || []).map(t => `<span class="card-tag">${esc(t)}</span>`).join('')}
              </div>
              <div class="card-footer">
                <button class="card-btn primary" onclick="event.stopPropagation(); openPost('${post.id}')">Read More</button>
                <button class="card-btn secondary" onclick="event.stopPropagation(); likePost('${post.id}')">👍 Like</button>
                <button class="card-btn secondary" onclick="event.stopPropagation(); sharePost('${post.id}')">🔗 Share</button>
              </div>
            </div>
          </article>
        `;
      }).join('');

      postsContainer.innerHTML = html;

      // Show/hide load more button
      loadMoreBtn.style.display = state.displayedPosts.length < state.filteredPosts.length ? 'block' : 'none';
    }

    function loadMorePosts() {
      state.currentPage++;
      renderPosts();
      window.scrollTo({ top: postsContainer.offsetTop - 100, behavior: 'smooth' });
    }

    window.openPost = async function(postId) {
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const modalTitle = document.getElementById('modalTitle');
      const modalMeta = document.getElementById('modalMeta');
      const modalImage = document.getElementById('modalImage');
      const modalTags = document.getElementById('modalTags');
      const modalContent = document.getElementById('modalContent');
      const modalLikes = document.getElementById('modalLikes');
      const modalLikeBtn = document.getElementById('modalLikeBtn');
      const modalShareBtn = document.getElementById('modalShareBtn');

      modalTitle.textContent = post.title || 'Untitled';
      modalMeta.innerHTML = `
        <div class="meta-item">📅 ${formatDate(post.publishedAt)}</div>
        <div class="meta-item">👁️ ${post.views} views</div>
        <div class="meta-item">👍 ${post.likes} likes</div>
      `;

      if (post.imageUrl) {
        modalImage.src = post.imageUrl;
        modalImage.style.display = 'block';
      } else {
        modalImage.style.display = 'none';
      }

      modalTags.innerHTML = (post.tags || []).map(t => `<span class="card-tag">${esc(t)}</span>`).join('');
      modalContent.innerHTML = post.bodyHtml || toHtml(post.fullText || post.shortText || '');
      modalLikes.textContent = post.likes;

      modalLikeBtn.onclick = () => likePost(postId);
      modalShareBtn.onclick = () => sharePost(postId);

      postModal.classList.add('open');
      document.body.style.overflow = 'hidden';

      // Increment view count
      const viewKey = 'viewed_' + postId;
      const now = Date.now();
      const lastView = Number(localStorage.getItem(viewKey) || 0);
      
      if (!lastView || now - lastView > 12 * 60 * 60 * 1000) {
        try {
          await updateDoc(doc(db, 'blogs', postId), { views: increment(1) });
          localStorage.setItem(viewKey, String(now));
          post.views++;
          modalMeta.innerHTML = `
            <div class="meta-item">📅 ${formatDate(post.publishedAt)}</div>
            <div class="meta-item">👁️ ${post.views} views</div>
            <div class="meta-item">👍 ${post.likes} likes</div>
          `;
        } catch (e) {
          console.warn('View increment failed', e);
        }
      }
    };

    function closeModal() {
      postModal.classList.remove('open');
      document.body.style.overflow = '';
    }

    window.likePost = async function(postId) {
      const likeKey = 'liked_' + postId;
      if (localStorage.getItem(likeKey)) {
        showToast('You already liked this post');
        return;
      }

      try {
        await updateDoc(doc(db, 'blogs', postId), { likes: increment(1) });
        localStorage.setItem(likeKey, '1');
        
        const post = state.posts.find(p => p.id === postId);
        if (post) {
          post.likes++;
          renderPosts();
          
          // Update modal if open
          if (postModal.classList.contains('open')) {
            document.getElementById('modalLikes').textContent = post.likes;
            document.getElementById('modalMeta').innerHTML = `
              <div class="meta-item">📅 ${formatDate(post.publishedAt)}</div>
              <div class="meta-item">👁️ ${post.views} views</div>
              <div class="meta-item">👍 ${post.likes} likes</div>
            `;
          }
        }
        
        showToast('Thanks for the like!');
      } catch (e) {
        console.error('Like failed', e);
        showToast('Like failed');
      }
    };

    window.sharePost = async function(postId) {
      const post = state.posts.find(p => p.id === postId);
      if (!post) return;

      const url = `${location.origin}/blog/?post=${postId}`;
      const title = post.title || 'Yangerila Blog';
      const text = post.shortText || 'Check out this post';

      try {
        if (navigator.share) {
          await navigator.share({ title, text, url });
        } else {
          await navigator.clipboard.writeText(url);
          showToast('Link copied to clipboard');
        }
      } catch {
        try {
          await navigator.clipboard.writeText(url);
          showToast('Link copied to clipboard');
        } catch {
          showToast('Could not share');
        }
      }
    };

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function formatDate(timestamp) {
      if (!timestamp || !timestamp.seconds) return '';
      const date = new Date(timestamp.seconds * 1000);
      return date.toLocaleDateString('en-US', { 
        year: 'numeric', 
        month: 'short', 
        day: 'numeric' 
      });
    }

    function getTimestamp(t) {
      return t?.seconds ? t.seconds * 1000 : 0;
    }

    function truncate(str, maxLen) {
      if (str.length <= maxLen) return str;
      return str.substr(0, maxLen).trim() + '...';
    }

    function toHtml(txt) {
      const safe = esc(txt || '');
      const linkified = safe.replace(/(https?:\/\/[^\s]+)/g, m => `<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
      return linkified.split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
    }

    function esc(s = '') {
      return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    // Check for direct post link
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('post');
    if (postId) {
      // Wait for posts to load then open
      const checkLoaded = setInterval(() => {
        if (state.posts.length > 0) {
          clearInterval(checkLoaded);
          openPost(postId);
        }
      }, 100);
    }
  </script>
</body>
