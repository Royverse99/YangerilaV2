<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>3D Guitar Room</title>
  <style>
    /* ---------- Responsive sizing controls ---------- */
    :root {
      /* Main guitar width scales with viewport, capped to original look */
      --gtr-w: clamp(240px, 38vw, 420px);
      /* Back guitars scale relative to the main */
      --gtr2-w: calc(var(--gtr-w) * 0.86);
      --gtr3-w: calc(var(--gtr-w) * 0.71);
      /* Shadow width scales with viewport, capped to original 450px */
      --shadow-w: clamp(260px, 42vw, 450px);
    }
    @media (max-width: 768px) {
      :root {
        --gtr-w: clamp(220px, 60vw, 300px);
        --shadow-w: clamp(220px, 60vw, 350px);
      }
    }
    @media (max-width: 480px) {
      :root {
        --gtr-w: clamp(200px, 70vw, 260px);
        --shadow-w: clamp(200px, 70vw, 300px);
      }
    }
    /* ------------------------------------------------ */

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      filter: sepia(0.1) brightness(0.9) contrast(1.05);
    }

    /* Background brick wall - scaled larger and pushed back */
    .bg {
      position: fixed;
      inset: 0;
      background: url("wp-content/uploads/2022/04/wall.jpg") center/cover no-repeat;
      z-index: 0;
      filter: brightness(0.3);
      will-change: transform;
      transform: scale(1.3); /* Larger wall */
    }

    /* Dynamic spotlight - flat round shape */
    .spotlight {
      position: fixed;
      inset: 0;
      background: radial-gradient(
        circle at var(--spot-x, 50%) var(--spot-y, 30%),
        rgba(255, 220, 180, 0.5) 0%,
        rgba(255, 200, 150, 0.3) 20%,
        rgba(255, 180, 120, 0.15) 40%,
        rgba(0, 0, 0, 0.85) 70%
      );
      pointer-events: none;
      z-index: 5;
      mix-blend-mode: screen;
      will-change: transform;
    }

    /* Add transitions only on desktop */
    @media (hover: hover) and (pointer: fine) {
      .spotlight {
        transition: all 0.2s ease-out;
      }
    }

    /* Smoke layers with seamless blurred edges and overlapping */
    .smoke1,
    .smoke2,
    .smoke3,
    .smoke4,
    .smoke5,
    .smoke6,
    .smoke7,
    .smoke8,
    .smoke9,
    .smoke10,
    .smoke11,
    .smoke12 {
      position: fixed;
      bottom: 0;
      left: -20%; /* Extend beyond viewport */
      right: -20%; /* Extend beyond viewport */
      width: 140%; /* Make wider for seamless loop */
      height: 70%;
      background-position: center bottom;
      background-repeat: repeat-x;
      background-size: auto 100%;
      pointer-events: none;
      mix-blend-mode: lighten;
      will-change: transform;
      /* Enhanced blurred edges with wider fade zones */
      mask: linear-gradient(
        to right,
        transparent 0%,
        rgba(0, 0, 0, 0.2) 3%,
        rgba(0, 0, 0, 0.6) 8%,
        black 12%,
        black 88%,
        rgba(0, 0, 0, 0.6) 92%,
        rgba(0, 0, 0, 0.2) 97%,
        transparent 100%
      );
      -webkit-mask: linear-gradient(
        to right,
        transparent 0%,
        rgba(0, 0, 0, 0.2) 3%,
        rgba(0, 0, 0, 0.6) 8%,
        black 12%,
        black 88%,
        rgba(0, 0, 0, 0.6) 92%,
        rgba(0, 0, 0, 0.2) 97%,
        transparent 100%
      );
    }

    /* Front smoke layers (in front of guitar) */
    .smoke1 {
      background-image: url("wp-content/uploads/2022/04/smoke1.png");
      opacity: 0.6;
      animation: drift1 35s linear infinite;
      height: 80%;
      z-index: 4;
    }
    .smoke2 {
      background-image: url("wp-content/uploads/2022/04/smoke2.png");
      opacity: 0.4;
      animation: drift2 50s linear infinite;
      height: 70%;
      z-index: 3;
    }
    .smoke3 {
      background-image: url("wp-content/uploads/2022/04/smoke3.png");
      opacity: 0.3;
      animation: drift3 65s linear infinite;
      height: 60%;
      z-index: 3;
    }

    /* Additional front smoke layers (over guitar) */
    .smoke7 {
      background-image: url("wp-content/uploads/2022/04/smoke1.png");
      opacity: 0.2;
      animation: drift1 40s linear infinite;
      height: 50%;
      z-index: 6;
      transform: scaleY(-1);
    }
    .smoke8 {
      background-image: url("wp-content/uploads/2022/04/smoke3.png");
      opacity: 0.15;
      animation: drift3 55s linear infinite reverse;
      height: 45%;
      z-index: 6;
    }

    /* Back smoke layers */
    .smoke4 {
      background-image: url("wp-content/uploads/2022/04/smoke1.png");
      opacity: 0.25;
      animation: drift4 25s linear infinite reverse;
      height: 75%;
      z-index: 1;
      transform: scaleX(-1);
    }
    .smoke5 {
      background-image: url("wp-content/uploads/2022/04/smoke2.png");
      opacity: 0.2;
      animation: drift5 40s linear infinite reverse;
      height: 65%;
      z-index: 1;
    }
    .smoke6 {
      background-image: url("wp-content/uploads/2022/04/smoke3.png");
      opacity: 0.15;
      animation: drift6 55s linear infinite;
      height: 50%;
      z-index: 1;
      transform: scaleX(-1);
    }

    /* Enhanced smoke animations for perfect seamless looping */
    @keyframes drift1 {
      0% { background-position: -800px bottom; }
      100% { background-position: 800px bottom; }
    }
    @keyframes drift2 {
      0% { background-position: 800px bottom; }
      100% { background-position: -800px bottom; }
    }
    @keyframes drift3 {
      0% { background-position: -600px bottom; }
      100% { background-position: 1000px bottom; }
    }
    @keyframes drift4 {
      0% { background-position: 1000px bottom; }
      100% { background-position: -1000px bottom; }
    }
    @keyframes drift5 {
      0% { background-position: -700px bottom; }
      100% { background-position: 900px bottom; }
    }
    @keyframes drift6 {
      0% { background-position: 900px bottom; }
      100% { background-position: -700px bottom; }
    }
    @keyframes drift7 {
      0% { background-position: -500px bottom; }
      100% { background-position: 1100px bottom; }
    }
    @keyframes drift8 {
      0% { background-position: 1100px bottom; }
      100% { background-position: -500px bottom; }
    }

    /* Guitar container - main front guitar (largest) - pure 2D parallax */
    .guitar {
      position: fixed;
      top: 50%;
      left: 58%; /* was 55% — slightly more to the right for extra gap */
      transform: translate(-50%, -50%);
      width: var(--gtr-w);
      z-index: 5;
      pointer-events: none;
      will-change: transform;
      filter: drop-shadow(0px 20px 40px rgba(0, 0, 0, 0.8));
      transition: all 0.1s ease-out;
    }
    .guitar img { width: 100%; height: auto; }

    /* Back guitars - stacked with 50% visibility each */
    .guitar-back {
      position: fixed;
      pointer-events: none;
      will-change: transform;
      transition: all 0.1s ease-out;
    }
    .guitar-back img { width: 100%; height: auto; }

    /* Guitar 2 - second guitar (closer and right) */
    .guitar-2 {
      top: 50%;
      left: 50%;
      width: var(--gtr2-w);
      z-index: 4;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0px 18px 36px rgba(0, 0, 0, 0.75));
    }

    /* Guitar 3 - third guitar (closer and centered more) */
    .guitar-3 {
      top: 50%;
      left: 42%; /* was 45% — further left for extra gap */
      width: var(--gtr3-w);
      z-index: 3;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0px 16px 32px rgba(0, 0, 0, 0.7));
    }

    /* Guitar shadows - one for each guitar */
    .shadow {
      position: fixed;
      height: auto;
      pointer-events: none;
      will-change: transform;
      transition: all 0.1s ease-out;
      filter: blur(8px) brightness(0.15) contrast(3);
    }
    .shadow img { width: 100%; height: auto; }

    /* Main guitar shadow */
    .shadow-1 {
      top: 70%;
      left: 63%; /* was 60% — +5% from guitar's 58% */
      width: var(--shadow-w);
      transform: translate(-50%, -50%)
        translateX(var(--shadow-1-offset-x, 20px))
        translateY(var(--shadow-1-offset-y, 10px))
        scale(var(--shadow-1-scale, 1.3));
      z-index: 4;
      opacity: var(--shadow-1-opacity, 0.6);
    }

    /* Guitar 2 shadow */
    .shadow-2 {
      top: 70%;
      left: 56%;
      width: var(--shadow-w);
      transform: translate(-50%, -50%)
        translateX(var(--shadow-2-offset-x, 15px))
        translateY(var(--shadow-2-offset-y, 8px))
        scale(var(--shadow-2-scale, 1.3));
      z-index: 3;
      opacity: var(--shadow-2-opacity, 0.55);
    }

    /* Guitar 3 shadow */
    .shadow-3 {
      top: 70%;
      left: 49%;
      width: var(--shadow-w);
      transform: translate(-50%, -50%)
        translateX(var(--shadow-3-offset-x, 10px))
        translateY(var(--shadow-3-offset-y, 6px))
        scale(var(--shadow-3-scale, 1.3));
      z-index: 2;
      opacity: var(--shadow-3-opacity, 0.5);
    }

    /* Musical notes with depth illusion */
    .music-notes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
    }
    .note {
      position: absolute;
      font-size: 20px;
      font-weight: bold;
      animation: float-note 12s ease-in-out infinite;
      will-change: transform;
    }
    /* Near notes (front of room) */
    .note-near { color: rgba(255, 215, 0, 0.8); z-index: 4; font-size: 28px; }
    /* Mid notes */
    .note-mid { color: rgba(255, 180, 100, 0.6); z-index: 2; font-size: 22px; }
    /* Far notes (back of room) */
    .note-far { color: rgba(255, 150, 80, 0.4); z-index: 1; font-size: 16px; filter: blur(0.5px); }

    .note:nth-child(1) { left: 15%; top: 25%; animation-delay: 0s; }
    .note:nth-child(2) { left: 75%; top: 35%; animation-delay: -3s; }
    .note:nth-child(3) { left: 25%; top: 70%; animation-delay: -6s; }
    .note:nth-child(4) { left: 85%; top: 60%; animation-delay: -9s; }
    .note:nth-child(5) { left: 45%; top: 20%; animation-delay: -2s; }
    .note:nth-child(6) { left: 65%; top: 80%; animation-delay: -5s; }
    .note:nth-child(7) { left: 30%; top: 45%; animation-delay: -8s; }
    .note:nth-child(8) { left: 80%; top: 25%; animation-delay: -1s; }
    .note:nth-child(9) { left: 20%; top: 55%; animation-delay: -4s; }
    .note:nth-child(10) { left: 90%; top: 40%; animation-delay: -7s; }
    .note:nth-child(11) { left: 35%; top: 15%; animation-delay: -10s; }
    .note:nth-child(12) { left: 55%; top: 75%; animation-delay: -11s; }
    .note:nth-child(13) { left: 10%; top: 65%; animation-delay: -12s; }
    .note:nth-child(14) { left: 70%; top: 50%; animation-delay: -13s; }
    .note:nth-child(15) { left: 40%; top: 85%; animation-delay: -14s; }

    /* Floating particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: rgba(255, 200, 100, 0.6);
      border-radius: 50%;
      animation: particle-float 15s ease-in-out infinite;
    }
    .particle-small {
      width: 2px;
      height: 2px;
      background: rgba(255, 180, 80, 0.4);
      animation-duration: 20s;
    }
    .particle-large {
      width: 4px;
      height: 4px;
      background: rgba(255, 220, 120, 0.8);
      animation-duration: 12s;
    }

    @keyframes particle-float {
      0%, 100% {
        transform: translateY(0px) translateX(0px) scale(0.5);
        opacity: 0.3;
      }
      25% {
        transform: translateY(-50px) translateX(35px) scale(1.2);
        opacity: 0.9;
      }
      50% {
        transform: translateY(-90px) translateX(-20px) scale(0.8);
        opacity: 1;
      }
      75% {
        transform: translateY(-40px) translateX(45px) scale(1.4);
        opacity: 0.6;
      }
    }

    @keyframes float-note {
      0%, 100% {
        transform: translateY(0px) translateX(0px) rotate(0deg) scale(1);
        opacity: 0.3;
      }
      25% {
        transform: translateY(-40px) translateX(-25px) rotate(15deg) scale(1.2);
        opacity: 0.8;
      }
      50% {
        transform: translateY(-70px) translateX(30px) rotate(-10deg) scale(1.1);
        opacity: 1;
      }
      75% {
        transform: translateY(-35px) translateX(-15px) rotate(20deg) scale(0.9);
        opacity: 0.7;
      }
    }

    /* Responsive font tweaks preserved from original breakpoints */
    @media (max-width: 768px) {
      .note { font-size: 16px; }
      .note-near { font-size: 22px; }
      .note-mid { font-size: 18px; }
      .note-far { font-size: 14px; }
    }
    @media (max-width: 480px) {
      /* widths handled by variables; proportions preserved */
    }
    @media (max-width: 500px) {
      .guitar   { left: 65%; } /* more right */
      .guitar-2 { left: 45%; } /* middle */
      .guitar-3 { left: 30%; } /* more left */
      .shadow-1 { left: 65%; }
      .shadow-2 { left: 55%; }
      .shadow-3 { left: 45%; }
    }

    /* =========================================================
       MOBILE "PHOTO" MODE: static scene + animated notes only
       ========================================================= */
    /* Detect mobile via coarse pointer or add .static-mobile class via JS */
    @media (hover: none) and (pointer: coarse) {
      body.static-mobile .smoke1,
      body.static-mobile .smoke2,
      body.static-mobile .smoke3,
      body.static-mobile .smoke4,
      body.static-mobile .smoke5,
      body.static-mobile .smoke6,
      body.static-mobile .smoke7,
      body.static-mobile .smoke8 {
        animation: none !important;       /* stop drifting */
        transform: none !important;       /* no parallax shifts */
      }
      body.static-mobile .particles {
        display: none !important;         /* hide particles on phone */
      }
      body.static-mobile .bg,
      body.static-mobile .guitar,
      body.static-mobile .guitar-2,
      body.static-mobile .guitar-3,
      body.static-mobile .shadow-1,
      body.static-mobile .shadow-2,
      body.static-mobile .shadow-3,
      body.static-mobile .spotlight {
        transition: none !important;      /* no easing */
      }
      /* Keep everything perfectly centered, like a photograph */
      body.static-mobile .bg {
        transform: scale(1.3) translateX(0) translateY(0) !important;
      }
      body.static-mobile .guitar,
      body.static-mobile .guitar-2,
      body.static-mobile .guitar-3 {
        transform: translate(-50%, -50%) !important;
      }
      body.static-mobile .shadow-1,
      body.static-mobile .shadow-2,
      body.static-mobile .shadow-3 {
        --shadow-1-offset-x: 20px; --shadow-1-offset-y: 10px;
        --shadow-2-offset-x: 15px; --shadow-2-offset-y: 8px;
        --shadow-3-offset-x: 10px; --shadow-3-offset-y: 6px;
      }
      /* Pin spotlight to a tasteful middle position */
      body.static-mobile .spotlight {
        --spot-x: 50%;
        --spot-y: 35%;
      }
      /* Keep musical notes animating */
      body.static-mobile .note { animation-play-state: running !important; }
    }
  </style>
</head>
<body>
  <!-- Background layers -->
  <div class="bg"></div>

  <!-- Guitar shadows using actual guitar image -->
  <div class="shadow shadow-3">
    <img src="wp-content/uploads/2022/04/guitar3.png" alt="Guitar Shadow 3" />
  </div>
  <div class="shadow shadow-2">
    <img src="wp-content/uploads/2022/04/guitar2.png" alt="Guitar Shadow 2" />
  </div>
  <div class="shadow shadow-1">
    <img src="wp-content/uploads/2022/04/guitar.png" alt="Guitar Shadow 1" />
  </div>

  <!-- Back smoke layers (behind guitar) -->
  <div class="smoke4"></div>
  <div class="smoke5"></div>
  <div class="smoke6"></div>

  <!-- Back guitars stacked evenly behind main guitar -->
  <div class="guitar-back guitar-3">
    <img src="wp-content/uploads/2022/04/guitar3.png" alt="Guitar 3" />
  </div>
  <div class="guitar-back guitar-2">
    <img src="wp-content/uploads/2022/04/guitar2.png" alt="Guitar 2" />
  </div>

  <!-- Main guitar (front) -->
  <div class="guitar">
    <img src="wp-content/uploads/2022/04/guitar.png" alt="Guitar" />
  </div>

  <!-- Front smoke layers (in front of guitar) -->
  <div class="smoke1"></div>
  <div class="smoke2"></div>
  <div class="smoke3"></div>

  <!-- Additional overlapping front smoke (over guitar) -->
  <div class="smoke7"></div>
  <div class="smoke8"></div>

  <!-- Musical notes with depth -->
  <div class="music-notes">
    <div class="note note-far">♪</div>
    <div class="note note-mid">♫</div>
    <div class="note note-near">♪</div>
    <div class="note note-far">♬</div>
    <div class="note note-mid">♪</div>
    <div class="note note-near">♫</div>
    <div class="note note-far">♪</div>
    <div class="note note-mid">♬</div>
    <div class="note note-near">♪</div>
    <div class="note note-far">♫</div>
    <div class="note note-mid">♪</div>
    <div class="note note-near">♬</div>
    <div class="note note-far">♪</div>
    <div class="note note-mid">♫</div>
    <div class="note note-near">♪</div>
  </div>

  <!-- Floating particles -->
  <div class="particles">
    <div class="particle"></div>
    <div class="particle particle-small"></div>
    <div class="particle particle-large"></div>
    <div class="particle"></div>
    <div class="particle particle-small"></div>
    <div class="particle particle-large"></div>
    <div class="particle"></div>
    <div class="particle particle-small"></div>
    <div class="particle particle-large"></div>
    <div class="particle"></div>
  </div>

  <!-- Dynamic spotlight -->
  <div class="spotlight"></div>

  <script>
    const bg = document.querySelector('.bg');
    const guitar = document.querySelector('.guitar');
    const guitar2 = document.querySelector('.guitar-2');
    const guitar3 = document.querySelector('.guitar-3');
    const shadow1 = document.querySelector('.shadow-1');
    const shadow2 = document.querySelector('.shadow-2');
    const shadow3 = document.querySelector('.shadow-3');
    const spotlight = document.querySelector('.spotlight');
    const smokeElements = document.querySelectorAll(
      '.smoke1, .smoke2, .smoke3, .smoke4, .smoke5, .smoke6, .smoke7, .smoke8'
    );
    const musicNotes = document.querySelectorAll('.note');
    const particles = document.querySelectorAll('.particle');

    const isDesktop = !(
      /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
        navigator.userAgent
      )
    );

    // Room dimensions for panning effect
    const maxPanX = 30;
    const maxPanY = 20;

    function updateRoomView(normalizedX, normalizedY) {
      const panX = normalizedX * maxPanX;
      const panY = normalizedY * maxPanY;

      // Background wall panning
      bg.style.transform = `translateX(${panX * 0.5}px) translateY(${
        panY * 0.4
      }px) scale(1.3)`;

      // Main guitar (front)
      guitar.style.transform = `translate(-50%, -50%) translateX(${
        panX * 0.5
      }px) translateY(${panY * 0.4}px)`;

      // Guitar 2
      if (guitar2) {
        guitar2.style.transform = `translate(-50%, -50%) translateX(${
          panX * 0.4
        }px) translateY(${panY * 0.32}px)`;
      }

      // Guitar 3
      if (guitar3) {
        guitar3.style.transform = `translate(-50%, -50%) translateX(${
          panX * 0.3
        }px) translateY(${panY * 0.24}px)`;
      }

      // Spotlight tracking
      const spotX = 50 + normalizedX * 40;
      const spotY = 30 + normalizedY * 50;
      spotlight.style.setProperty('--spot-x', spotX + '%');
      spotlight.style.setProperty('--spot-y', spotY + '%');

      // Shadows opposite movement
      const shadowDisplaceX = -normalizedX * 50;
      const shadowDisplaceY = -normalizedY * 35;

      const shadowScale1 = 1.3 + Math.abs(normalizedX + normalizedY) * 0.3;
      const shadowOpacity1 = 0.6 - Math.abs(normalizedX + normalizedY) * 0.1;

      shadow1.style.setProperty('--shadow-1-offset-x', shadowDisplaceX + 'px');
      shadow1.style.setProperty('--shadow-1-offset-y', shadowDisplaceY + 'px');
      shadow1.style.setProperty('--shadow-1-scale', shadowScale1);
      shadow1.style.setProperty('--shadow-1-opacity', shadowOpacity1);

      shadow2.style.setProperty(
        '--shadow-2-offset-x',
        shadowDisplaceX * 0.8 + 'px'
      );
      shadow2.style.setProperty(
        '--shadow-2-offset-y',
        shadowDisplaceY * 0.8 + 'px'
      );
      shadow2.style.setProperty('--shadow-2-scale', shadowScale1);
      shadow2.style.setProperty('--shadow-2-opacity', shadowOpacity1 * 0.92);

      shadow3.style.setProperty(
        '--shadow-3-offset-x',
        shadowDisplaceX * 0.6 + 'px'
      );
      shadow3.style.setProperty(
        '--shadow-3-offset-y',
        shadowDisplaceY * 0.6 + 'px'
      );
      shadow3.style.setProperty('--shadow-3-scale', shadowScale1);
      shadow3.style.setProperty('--shadow-3-opacity', shadowOpacity1 * 0.84);

      // Smoke layers parallax - 2D translate
      smokeElements.forEach((smoke, index) => {
        let depth;
        if (index < 3) depth = (index + 1) * 0.3;
        else if (index >= 6 && index < 8) depth = 0.8;
        else depth = (index - 2) * 0.1;

        const smokeX = panX * depth;
        const smokeY = panY * depth * 0.5;

        smoke.style.transform = `translateX(${smokeX}px) translateY(${smokeY}px)`;
      });

      // Musical notes depth movement (base animation remains)
      musicNotes.forEach((note) => {
        const isNear = note.classList.contains('note-near');
        const isMid = note.classList.contains('note-mid');
        const isFar = note.classList.contains('note-far');

        let depthFactor = 0.4;
        if (isNear) depthFactor = 1.2;
        else if (isMid) depthFactor = 0.8;
        else if (isFar) depthFactor = 0.3;

        const noteX = panX * depthFactor;
        const noteY = panY * depthFactor * 0.8;

        const baseTransform = note.style.transform.replace(
          /translateX\([^)]*\)|translateY\([^)]*\)/g,
          ''
        );
        note.style.transform =
          baseTransform + ` translateX(${noteX}px) translateY(${noteY}px)`;
      });

      // Particles depth movement (desktop only; hidden on mobile via CSS)
      particles.forEach((particle, index) => {
        const depthFactor = 0.3 + (index % 3) * 0.4;
        const particleX = panX * depthFactor;
        const particleY = panY * depthFactor * 0.7;

        const baseTransform = particle.style.transform.replace(
          /translateX\([^)]*\)|translateY\([^)]*\)/g,
          ''
        );
        particle.style.transform =
          baseTransform +
          ` translateX(${particleX}px) translateY(${particleY}px)`;
      });
    }

    /* ===========================
       DESKTOP: interactive mode
       =========================== */
    if (isDesktop) {
      let lastMouseTime = 0;
      let currentX = 0;
      let currentY = 0;
      let targetX = 0;
      let targetY = 0;

      function handleMouseMove(e) {
        const normalizedX = (e.clientX / window.innerWidth - 0.5) * 2;
        const normalizedY = (e.clientY / window.innerHeight - 0.5) * 2;

        targetX = normalizedX;
        targetY = normalizedY;
        lastMouseTime = Date.now();

        updateRoomView(normalizedX, normalizedY);
      }

      document.addEventListener('mousemove', handleMouseMove);

      function animateRoom() {
        const now = Date.now();
        const timeSinceLastMouse = now - lastMouseTime;

        // Start subtle animation 2 seconds after mouse stops
        if (timeSinceLastMouse > 2000) {
          const time = now * 0.0005;

          const gentleX =
            Math.sin(time) * 0.7 + Math.cos(time * 0.3) * 0.4;
          const gentleY =
            Math.cos(time * 0.8) * 0.6 + Math.sin(time * 0.5) * 0.3;

          const randomX =
            Math.sin(time * 1.7) * 0.2 + Math.cos(time * 2.3) * 0.15;
          const randomY =
            Math.cos(time * 1.9) * 0.25 + Math.sin(time * 1.1) * 0.2;

          const finalX = gentleX + randomX;
          const finalY = gentleY + randomY;

          const transitionFactor = Math.min(
            (timeSinceLastMouse - 2000) / 3000,
            1
          );

          currentX = targetX * (1 - transitionFactor) + finalX * transitionFactor;
          currentY = targetY * (1 - transitionFactor) + finalY * transitionFactor;

          updateRoomView(currentX, currentY);
        }

        requestAnimationFrame(animateRoom);
      }

      // Start the animation loop
      animateRoom();

      // Reset animation when page becomes visible again
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          lastMouseTime = Date.now();
        }
      });
    }

    /* =========================
       MOBILE: static "photo"
       ========================= */
    if (!isDesktop) {
      // Add a helper class so CSS can freeze animations + hide particles
      document.body.classList.add('static-mobile');

      // Ensure centered view and no further movement
      updateRoomView(0, 0);

      // Pause JS-driven transforms by not scheduling any RAF loops
      // (Notes continue to animate via CSS keyframes.)
    }
  </script>
</body>
</html>
