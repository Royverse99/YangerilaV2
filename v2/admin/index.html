<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Yangerila — Admin</title>

  <!-- Admin-only CSS (login has its own CSS—do not reuse) -->
  <link rel="stylesheet" href="/admin/style.css?v=1"/>
</head>
<body class="admin-page">

  <!-- Loading cover until auth + admin check passes -->
  <div id="loading">Checking login…</div>

  <main class="wrap" aria-live="polite">
    <section class="card">
      <header class="head">
        <!-- ✅ Same logo file as login, absolute path -->
        <img src="/wp-content/uploads/2022/04/coaching3-slider-pic1.webp" alt="Yangerila" class="logo"/>
        <h1>Yangerila Admin Panel</h1>
        <p class="muted" id="user-email">Loading…</p>
        <div class="head-actions">
          <button class="btn primary" id="signout">Sign out</button>
          <a class="btn" href="/admin/blog-editor.html">Open Blog Editor</a>
        </div>
      </header>

      <div class="dashboard">

        <!-- ================== Yangerila Web CRM (3 separate tabs) ================== -->
        <section class="section" id="crm-web">
          <h2>Yangerila Web CRM</h2>

          <!-- Coupon Forms Data -->
          <div class="subsection">
            <div class="subhead">
              <h3>Coupon Forms Data</h3>
              <div class="tools"><button class="btn small" id="refresh-coupon">Refresh</button></div>
            </div>
            <div class="table-wrap">
              <table id="table-coupon">
                <thead></thead>
                <tbody><tr><td class="muted center">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>

          <!-- Admission & Demo Form Data -->
          <div class="subsection">
            <div class="subhead">
              <h3>Admission &amp; Demo Form Data</h3>
              <div class="tools"><button class="btn small" id="refresh-admDemo">Refresh</button></div>
            </div>
            <div class="table-wrap">
              <table id="table-admDemo">
                <thead></thead>
                <tbody><tr><td class="muted center">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>

          <!-- Contact Us Form Data -->
          <div class="subsection">
            <div class="subhead">
              <h3>Contact Us Form Data</h3>
              <div class="tools"><button class="btn small" id="refresh-contact">Refresh</button></div>
            </div>
            <div class="table-wrap">
              <table id="table-contact">
                <thead></thead>
                <tbody><tr><td class="muted center">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ================== Form CRM (single sheet) ================== -->
        <section class="section" id="crm-form">
          <h2>Form CRM</h2>
          <div class="subsection">
            <div class="subhead">
              <h3>YCS Admissions</h3>
              <div class="tools"><button class="btn small" id="refresh-ycs">Refresh</button></div>
            </div>
            <div class="table-wrap tall">
              <table id="table-ycs">
                <thead></thead>
                <tbody><tr><td class="muted center">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- ================== Blogs preview ================== -->
        <section class="section" id="blogs-section">
          <h2>Blogs</h2>
          <div class="tools">
            <a class="btn small" href="/admin/blog-editor.html">Create / Edit Blogs</a>
          </div>
          <div class="blog-list" id="blog-list"></div>
        </section>
      </div>
    </section>
  </main>

  <!-- Image preview modal -->
  <div class="img-modal" id="imgModal" aria-hidden="true">
    <button class="close" aria-label="Close image preview">Close</button>
    <img src="" alt="preview">
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">Copied</div>

  <!-- Admin App (Firebase + Sheets) -->
  <script type="module" src="/admin/adminapp.js?v=1"></script>
</body>
</html>
