<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blog Editor – Yangerila Admin</title>

  <!-- Shared theme; editor/blog rules are SCOPED by body.blog-editor -->
  <link rel="stylesheet" href="/login/style.css?v=9"/>

  <!-- Quill -->
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
</head>
<body class="blog-editor">
  <div class="editor-container">
    <!-- Top Navigation -->
    <nav class="top-nav">
      <div class="nav-left">
        <img src="/wp-content/uploads/2022/04/coaching3-slider-pic1.webp" class="logo-small" alt="Yangerila"/>
        <div class="nav-title">
          <h1>Blog Editor</h1>
          <p class="user-email" id="user-email">Loading...</p>
        </div>
      </div>

      <!-- Actions: desktop = single row; phone = 4 x 2 grid -->
      <div class="nav-actions" id="navActions">
        <a class="btn" href="/admin/">Back to Admin</a>
        <a class="btn" href="/blog/">View Blog</a>
        <button class="btn" id="new-post">New Post</button>
        <button class="btn" id="save-draft">Save Draft</button>
        <button class="btn primary" id="publish">Publish</button>
        <button class="btn" id="preview">Preview</button>
        <button class="btn" id="unpublish">Unpublish</button>
        <button class="btn danger" id="delete-post">Delete</button>
        <label class="publish-toggle">
          <input type="checkbox" id="published">
          <span>Published</span>
        </label>
      </div>
    </nav>

    <!-- Main Editor Area -->
    <div class="editor-main" id="editorMain">
      <!-- Left Sidebar - Posts List -->
      <aside class="posts-sidebar" id="postsSidebar">
        <div class="sidebar-header">
          <h2>All Posts</h2>
          <div class="sidebar-tools">
            <button class="icon-btn" id="collapsePosts" title="Collapse">
              <!-- Up arrow -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M18 15l-6-6-6 6"/></svg>
            </button>
            <button class="icon-btn" id="expandPosts" title="Expand">
              <!-- Down arrow -->
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="2" d="M6 9l6 6 6-6"/></svg>
            </button>
          </div>
        </div>

        <div class="sidebar-search-wrap">
          <input class="sidebar-search" id="search" placeholder="Search posts..."/>
        </div>

        <div class="posts-list" id="post-list"></div>
      </aside>

      <!-- Center - Editor -->
      <main class="editor-center">
        <div class="editor-header">
          <input class="title-input" id="title" placeholder="Post title..."/>
        </div>

        <!-- Sticky toolbar + Fullscreen -->
        <div class="editor-toolbar-container">
          <div id="toolbar"></div>
          <button class="btn tiny ghost" id="toggleFullscreen" title="Fullscreen" aria-label="Toggle fullscreen">
            <!-- Fullscreen enter/exit combined icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-width="2" d="M9 3H3v6M3 3l6 6M15 21h6v-6m0 6l-6-6M21 9V3h-6m6 0l-6 6M3 15v6h6m-6 0l6-6"/>
            </svg>
          </button>
        </div>

        <div class="editor-scroll">
          <div id="editor"></div>
        </div>
      </main>

      <!-- Right Sidebar - Metadata -->
      <aside class="metadata-panel">
        <div class="metadata-section">
          <h3>Cover Image</h3>
          <div class="form-group">
            <label>Paste Image URL</label>
            <input id="imageUrl" placeholder="https://example.com/image.jpg"/>
            <img id="imagePreview" class="cover-preview" src="" alt="Cover preview"/>
          </div>
        </div>

        <div class="metadata-section">
          <h3>Tags</h3>
          <div class="form-group">
            <label>Comma separated</label>
            <input id="tags" placeholder="practice, technique, tips"/>
            <div class="tags-display" id="tagsDisplay"></div>
          </div>
        </div>

        <div class="metadata-section">
          <h3>Excerpt</h3>
          <div class="form-group">
            <label>Short Description</label>
            <textarea id="shortText" placeholder="Auto-generated from content if left empty"></textarea>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="pvTitle">Preview</h2>
        <button class="btn" id="closePreview">Close</button>
      </div>
      <div class="modal-body">
        <img id="pvCover" class="modal-cover" style="display:none" />
        <div class="tags-display" id="pvTags"></div>
        <article class="preview-content" id="pvBody"></article>
      </div>
    </div>
  </div>

  <!-- Quill -->
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

  <!-- Firebase + App logic -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc, deleteDoc,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

    // Firebase config
     const firebaseConfig = {
    apiKey: "AIzaSyDHDjHrnQ2IwwetQoV6cWAGnkMzANerVDE",
    authDomain: "yangerila-studio.firebaseapp.com",
    projectId: "yangerila-studio",
    storageBucket: "yangerila-studio.firebasestorage.app",
    messagingSenderId: "585529190595",
    appId: "1:585529190595:web:7555d8334949c3b30f9a76",
    measurementId: "G-39S037X9BB"
  };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // UI refs
    const emailEl = document.querySelector('#user-email');
    const listEl  = document.querySelector('#post-list');
    const searchEl= document.querySelector('#search');

    const titleEl = document.querySelector('#title');
    const tagsEl  = document.querySelector('#tags');
    const shortEl = document.querySelector('#shortText');
    const imgUrlEl= document.querySelector('#imageUrl');
    const imgPrev = document.querySelector('#imagePreview');
    const tagsDisplay = document.querySelector('#tagsDisplay');

    const newBtn  = document.querySelector('#new-post');
    const saveDraftBtn = document.querySelector('#save-draft');
    const publishBtn = document.querySelector('#publish');
    const unpublishBtn = document.querySelector('#unpublish');
    const deleteBtn  = document.querySelector('#delete-post');
    const publishedEl = document.querySelector('#published');

    const previewBtn = document.querySelector('#preview');
    const previewModal = document.querySelector('#previewModal');
    const closePreview = document.querySelector('#closePreview');
    const pvTitle = document.querySelector('#pvTitle');
    const pvCover = document.querySelector('#pvCover');
    const pvTags  = document.querySelector('#pvTags');
    const pvBody  = document.querySelector('#pvBody');

    // New controls
    const editorMain    = document.getElementById('editorMain');
    const postsSidebar  = document.getElementById('postsSidebar');
    const collapseBtn   = document.getElementById('collapsePosts');
    const expandBtn     = document.getElementById('expandPosts');
    const fsBtn         = document.getElementById('toggleFullscreen');

    let currentId = null;
    let postsCache = [];
    let isFullscreen = false;

    /* Quill toolbar (expanded) */
    const toolbarOptions = [
      [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
      [{ 'font': [] }],
      [{ 'size': ['small', false, 'large', 'huge'] }],
      ['bold', 'italic', 'underline', 'strike'],
      [{ 'color': [] }, { 'background': [] }],
      [{ 'script': 'sub'}, { 'script': 'super' }],
      [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'list': 'check' }],
      [{ 'indent': '-1'}, { 'indent': '+1' }],
      [{ 'direction': 'rtl' }],
      [{ 'align': [] }],
      ['blockquote', 'code-block'],
      ['link', 'image', 'video'],
      ['clean']
    ];

    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: {
          container: toolbarOptions,
          handlers: {
            image: function() {
              const url = prompt('Paste image URL:');
              if (!url) return;
              const range = quill.getSelection(true) || { index: quill.getLength(), length: 0 };
              quill.insertEmbed(range.index, 'image', url, 'user');
              quill.setSelection(range.index + 1, 0, 'user');
            }
          }
        }
      },
      placeholder: 'Start writing your post...'
    });

    // Auth/admin gate
    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace('/login/');
      emailEl.textContent = user.email || '';
      const adminSnap = await getDoc(doc(db, 'admins', user.uid));
      if (!adminSnap.exists()) {
        await signOut(auth);
        return location.replace('/login/?unauthorized=1');
      }
      await loadList();
      wireEvents();
    });

    function wireEvents(){
      newBtn.addEventListener('click', () => loadForm(null));
      saveDraftBtn.addEventListener('click', () => onSave({ publish:false }));
      publishBtn.addEventListener('click', () => onSave({ publish:true }));
      unpublishBtn.addEventListener('click', () => onSave({ publish:false, forceUnpublish:true }));
      deleteBtn.addEventListener('click', onDelete);

      imgUrlEl.addEventListener('input', syncCoverPreview);
      tagsEl.addEventListener('input', updateTagsDisplay);
      searchEl.addEventListener('input', () => renderList(filterPosts(searchEl.value)));

      previewBtn.addEventListener('click', openPreview);
      closePreview.addEventListener('click', () => previewModal.classList.remove('open'));
      previewModal.addEventListener('click', (e) => { if (e.target === previewModal) previewModal.classList.remove('open'); });

      // Sidebar expand/collapse (mobile-friendly)
      collapseBtn.addEventListener('click', () => {
        postsSidebar.classList.add('collapsed');
        postsSidebar.classList.remove('expanded');
      });
      expandBtn.addEventListener('click', () => {
        postsSidebar.classList.add('expanded');
        postsSidebar.classList.remove('collapsed');
      });

      // Fullscreen toggle (keeps logo/title + editor+toolbar)
      fsBtn.addEventListener('click', () => {
        isFullscreen = !isFullscreen;
        document.body.classList.toggle('editor-fullscreen', isFullscreen);
      });
    }

    function syncCoverPreview(){
      const url = imgUrlEl.value.trim();
      if (url){ imgPrev.src = url; imgPrev.style.display = 'block'; }
      else { imgPrev.removeAttribute('src'); imgPrev.style.display='none'; }
    }

    function updateTagsDisplay(){
      const tags = tagsEl.value.split(',').map(s => s.trim()).filter(Boolean);
      tagsDisplay.innerHTML = tags.map(t => `<span class="tag-pill">${esc(t)}</span>`).join('');
    }

    function filterPosts(q){
      if (!q) return postsCache;
      const s = q.toLowerCase();
      return postsCache.filter(p => (p.title||'').toLowerCase().includes(s));
    }

    async function loadList(){
      listEl.innerHTML = '<div style="padding:16px; color:var(--muted); text-align:center;">Loading...</div>';
      try{
        const snap = await getDocs(collection(db, 'blogs'));
        postsCache = [];
        snap.forEach(d => postsCache.push({ id:d.id, ...d.data() }));
        postsCache.sort((a,b)=>{
          const ap = !!a.published, bp = !!b.published;
          if (ap !== bp) return ap ? -1 : 1;
          const at = (a.publishedAt?.seconds || a.updatedAt?.seconds || 0);
          const bt = (b.publishedAt?.seconds || b.updatedAt?.seconds || 0);
          return bt - at;
        });
        renderList(postsCache);
        if (postsCache.length) select(postsCache[0].id);
        else loadForm(null);
      }catch(e){
        console.error(e);
        listEl.innerHTML = '<div style="padding:16px; color:var(--error);">Failed to load posts</div>';
      }
    }

    function renderList(items){
      if (!items.length) {
        listEl.innerHTML = '<div style="padding:16px; color:var(--muted); text-align:center;">No posts yet</div>';
        return;
      }
      // Compact cards: square thumbnail + single-line title
      listEl.innerHTML = items.map(p => `
        <div class="post-item" data-id="${p.id}">
          ${p.imageUrl ? `<img class="post-thumb" src="${esc(p.imageUrl)}" onerror="this.style.display='none'"/>` : '<div class="post-thumb"></div>'}
          <div class="post-info">
            <strong>${esc(p.title || 'Untitled')}</strong>
            <small>${p.published ? 'Published' : 'Draft'}${p.publishedAt ? ' • ' + new Date(p.publishedAt.seconds*1000).toLocaleDateString() : ''}</small>
          </div>
        </div>
      `).join('');
      listEl.querySelectorAll('.post-item').forEach(el => {
        el.addEventListener('click', () => select(el.getAttribute('data-id')));
      });
      highlightSelection();
    }

    function select(id){
      const p = postsCache.find(x => x.id === id);
      if (!p) return;
      currentId = id;
      loadForm(p);
      highlightSelection();
    }

    function highlightSelection(){
      listEl.querySelectorAll('.post-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-id') === currentId);
      });
    }

    function loadForm(p){
      currentId = p ? p.id : null;
      titleEl.value = p?.title || '';
      tagsEl.value  = (p?.tags || []).join(', ');
      shortEl.value = p?.shortText || '';
      imgUrlEl.value= p?.imageUrl || '';
      publishedEl.checked = !!p?.published;

      syncCoverPreview();
      updateTagsDisplay();

      quill.setContents([]);
      if (p?.bodyHtml) {
        quill.root.innerHTML = p.bodyHtml;
      } else if (p?.fullText) {
        quill.setText(p.fullText);
      }
    }

    function openPreview(){
      pvTitle.textContent = titleEl.value.trim() || 'Untitled';
      const url = imgUrlEl.value.trim();
      if (url){ pvCover.src = url; pvCover.style.display = 'block'; } else { pvCover.style.display = 'none'; }
      const tags = tagsEl.value.split(',').map(s=>s.trim()).filter(Boolean);
      pvTags.innerHTML = tags.map(t=>`<span class="tag-pill">${esc(t)}</span>`).join('');
      pvBody.innerHTML = quill.root.innerHTML;
      previewModal.classList.add('open');
    }

    function makeShort(html){
      const text = html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      return text.length > 220 ? text.slice(0, 220) + '…' : text;
    }

    async function onSave({ publish, forceUnpublish }){
      const payload = {
        title: titleEl.value.trim(),
        imageUrl: imgUrlEl.value.trim(),
        tags: tagsEl.value.split(',').map(s => s.trim()).filter(Boolean),
        bodyHtml: quill.root.innerHTML,
        shortText: (shortEl.value.trim() || makeShort(quill.root.innerHTML)),
        updatedAt: serverTimestamp()
      };

      let desiredPublished = publishedEl.checked;
      if (publish === true) desiredPublished = true;
      if (forceUnpublish === true) desiredPublished = false;
      payload.published = desiredPublished;
      if (desiredPublished && !currentId) payload.publishedAt = serverTimestamp();

      try{
        if (currentId){
          await updateDoc(doc(db, 'blogs', currentId), payload);
        } else {
          payload.createdAt = serverTimestamp();
          if (desiredPublished) payload.publishedAt = serverTimestamp();
          const ref = await addDoc(collection(db, 'blogs'), payload);
          currentId = ref.id;
        }
        await loadList();
        alert('Saved successfully!');
      }catch(e){
        console.error(e);
        alert('Save failed. Check rules and network.');
      }
    }

    async function onDelete(){
      if (!currentId) return alert('No post selected.');
      if (!confirm('Delete this post? This action cannot be undone.')) return;
      try{
        await deleteDoc(doc(db, 'blogs', currentId));
        currentId = null;
        await loadList();
        loadForm(null);
        alert('Post deleted successfully.');
      }catch(e){
        console.error(e);
        alert('Delete failed.');
      }
    }

    function esc(s=''){return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  </script>
</body>
</html>
