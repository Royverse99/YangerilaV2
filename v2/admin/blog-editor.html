<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blog Editor – Yangerila Admin</title>

  <!-- Reuse your admin/login theme -->
  <link rel="stylesheet" href="/login/style.css?v=6"/>

  <!-- Quill (free) -->
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">

  <style>
    /* Reset for full screen */
    body { margin: 0; padding: 0; overflow: hidden; }
    .wrap { min-height: 100vh; padding: 0; display: block; }
    
    /* Full screen editor layout */
    .editor-container {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
      background: var(--bg2);
    }

    /* Top navigation bar */
    .top-nav {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-small {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: contain;
    }

    .nav-title {
      display: flex;
      flex-direction: column;
    }

    .nav-title h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .nav-title .user-email {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-actions .btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      width: auto;
    }

    .nav-actions .btn.primary {
      padding: 8px 20px;
    }

    .publish-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .publish-toggle input {
      width: auto;
      margin: 0;
    }

    /* Main editor area */
    .editor-main {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      height: calc(100vh - 73px);
      overflow: hidden;
    }

    @media (max-width: 1400px) {
      .editor-main { grid-template-columns: 260px 1fr 300px; }
    }

    @media (max-width: 1024px) {
      .editor-main { grid-template-columns: 240px 1fr; }
      .metadata-panel { display: none; }
    }

    @media (max-width: 768px) {
      .editor-main { grid-template-columns: 1fr; }
      .posts-sidebar { display: none; }
    }

    /* Left sidebar - Posts list */
    .posts-sidebar {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      margin: 0 0 12px;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .sidebar-search {
      width: 100%;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.05);
      color: var(--text);
      font-size: 13px;
    }

    .posts-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .post-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: rgba(255,255,255,0.02);
      margin-bottom: 8px;
      transition: all 0.2s;
    }

    .post-item:hover {
      background: rgba(255,255,255,0.05);
      border-color: rgba(122,231,199,0.3);
    }

    .post-item.active {
      background: rgba(122,231,199,0.1);
      border-color: var(--accent);
    }

    .post-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      flex-shrink: 0;
    }

    .post-info {
      flex: 1;
      min-width: 0;
    }

    .post-info strong {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .post-info small {
      display: block;
      font-size: 11px;
      color: var(--muted);
    }

    /* Center - Editor */
    .editor-center {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg1);
    }

    .editor-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .title-input {
      width: 100%;
      padding: 12px 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 32px;
      font-weight: 700;
      outline: none;
      font-family: inherit;
    }

    .title-input::placeholder {
      color: var(--muted);
      opacity: 0.5;
    }

    .editor-toolbar-container {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0;
    }

    /* Enhanced Quill toolbar */
    .ql-toolbar.ql-snow {
      border: none;
      background: transparent;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .ql-toolbar .ql-formats {
      margin-right: 12px;
      display: flex;
      gap: 2px;
    }

    .ql-snow .ql-stroke {
      stroke: var(--muted);
    }

    .ql-snow .ql-fill {
      fill: var(--muted);
    }

    .ql-snow .ql-picker-label {
      color: var(--muted);
    }

    .ql-snow.ql-toolbar button:hover,
    .ql-snow .ql-toolbar button:hover {
      color: var(--accent);
    }

    .ql-snow.ql-toolbar button:hover .ql-stroke,
    .ql-snow .ql-toolbar button:hover .ql-stroke {
      stroke: var(--accent);
    }

    .ql-snow.ql-toolbar button.ql-active,
    .ql-snow .ql-toolbar button.ql-active {
      color: var(--accent);
    }

    .ql-snow.ql-toolbar button.ql-active .ql-stroke,
    .ql-snow .ql-toolbar button.ql-active .ql-stroke {
      stroke: var(--accent);
    }

    .ql-snow.ql-toolbar button.ql-active .ql-fill,
    .ql-snow .ql-toolbar button.ql-active .ql-fill {
      fill: var(--accent);
    }

    /* Editor content area */
    .editor-scroll {
      flex: 1;
      overflow-y: auto;
      background: var(--panel);
    }

    .ql-container.ql-snow {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 16px;
      line-height: 1.8;
      max-width: 800px;
      margin: 0 auto;
      padding: 24px;
    }

    .ql-editor {
      padding: 0;
      min-height: calc(100vh - 300px);
    }

    .ql-editor.ql-blank::before {
      color: var(--muted);
      opacity: 0.5;
      font-style: normal;
      left: 0;
    }

    .ql-editor h1, .ql-editor h2, .ql-editor h3 {
      color: var(--text);
    }

    .ql-editor a {
      color: var(--accent);
    }

    /* Right sidebar - Metadata */
    .metadata-panel {
      background: var(--panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 20px;
    }

    .metadata-section {
      margin-bottom: 24px;
    }

    .metadata-section h3 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }

    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }

    .cover-preview {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 8px;
      display: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cover-preview:hover {
      opacity: 0.8;
    }

    .file-upload-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .file-upload-group input[type="file"] {
      flex: 1;
      font-size: 11px;
      padding: 6px;
    }

    .file-upload-group .btn {
      padding: 8px 12px;
      font-size: 11px;
      white-space: nowrap;
      width: auto;
    }

    /* Tags display */
    .tags-display {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .tag-pill {
      font-size: 11px;
      background: rgba(122,231,199,0.15);
      border: 1px solid rgba(122,231,199,0.3);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--accent);
    }

    /* Preview Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }

    .modal-header {
      position: sticky;
      top: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .modal-header h2 {
      font-size: 24px;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    .modal-body {
      padding: 24px;
    }

    .modal-cover {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .preview-content {
      color: var(--text);
      line-height: 1.8;
      font-size: 16px;
    }

    .preview-content p {
      margin: 0 0 16px;
    }

    .preview-content h1,
    .preview-content h2,
    .preview-content h3 {
      color: var(--text);
      margin-top: 24px;
      margin-bottom: 12px;
    }

    /* Status bar */
    .status-bar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 8px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255,255,255,0.02);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(122,231,199,0.2);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(122,231,199,0.3);
    }

    /* Responsive adjustments */
    @media (max-width: 640px) {
      .top-nav {
        padding: 12px;
      }

      .nav-actions {
        width: 100%;
        justify-content: flex-start;
      }

      .nav-actions .btn {
        font-size: 12px;
        padding: 6px 12px;
      }

      .title-input {
        font-size: 24px;
      }

      .ql-toolbar.ql-snow {
        padding: 8px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="editor-container">
    <!-- Top Navigation -->
    <nav class="top-nav">
      <div class="nav-left">
        <img src="/v2/wp-content/uploads/2022/04/your-logo-file-name.png" class="logo-small" alt="Yangerila"/>
        <div class="nav-title">
          <h1>Blog Editor</h1>
          <p class="user-email" id="user-email">Loading...</p>
        </div>
      </div>
      <div class="nav-actions">
        <a class="btn" href="/admin/">Back to Admin</a>
        <a class="btn" href="/blog/">View Blog</a>
        <button class="btn" id="new-post">New Post</button>
        <button class="btn" id="save-draft">Save Draft</button>
        <button class="btn primary" id="publish">Publish</button>
        <button class="btn" id="preview">Preview</button>
        <button class="btn" id="unpublish">Unpublish</button>
        <button class="btn" id="delete-post" style="background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: #ff6b6b;">Delete</button>
        <label class="publish-toggle">
          <input type="checkbox" id="published">
          <span>Published</span>
        </label>
      </div>
    </nav>

    <!-- Main Editor Area -->
    <div class="editor-main">
      <!-- Left Sidebar - Posts List -->
      <aside class="posts-sidebar">
        <div class="sidebar-header">
          <h2>All Posts</h2>
          <input class="sidebar-search" id="search" placeholder="Search posts..."/>
        </div>
        <div class="posts-list" id="post-list"></div>
      </aside>

      <!-- Center - Editor -->
      <main class="editor-center">
        <div class="editor-header">
          <input class="title-input" id="title" placeholder="Post title..."/>
        </div>
        <div class="editor-toolbar-container">
          <div id="toolbar"></div>
        </div>
        <div class="editor-scroll">
          <div id="editor"></div>
        </div>
      </main>

      <!-- Right Sidebar - Metadata -->
      <aside class="metadata-panel">
        <div class="metadata-section">
          <h3>Cover Image</h3>
          <div class="form-group">
            <label>Image URL</label>
            <input id="imageUrl" placeholder="https://example.com/image.jpg"/>
            <img id="imagePreview" class="cover-preview" src="" alt="Cover preview"/>
          </div>
          <div class="file-upload-group">
            <input type="file" id="imageFile" accept="image/*"/>
            <button class="btn" id="uploadCover">Upload</button>
          </div>
        </div>

        <div class="metadata-section">
          <h3>Tags</h3>
          <div class="form-group">
            <label>Comma separated</label>
            <input id="tags" placeholder="practice, technique, tips"/>
            <div class="tags-display" id="tagsDisplay"></div>
          </div>
        </div>

        <div class="metadata-section">
          <h3>Excerpt</h3>
          <div class="form-group">
            <label>Short Description</label>
            <textarea id="shortText" placeholder="Brief summary for the blog listing page (auto-generated if empty)"></textarea>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="pvTitle">Preview</h2>
        <button class="btn" id="closePreview">Close</button>
      </div>
      <div class="modal-body">
        <img id="pvCover" class="modal-cover" style="display:none" />
        <div class="tags-display" id="pvTags"></div>
        <article class="preview-content" id="pvBody"></article>
      </div>
    </div>
  </div>

  <!-- Firebase + Quill -->
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc, deleteDoc,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import {
      getStorage, ref as sRef, uploadBytes, getDownloadURL
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

    // --- Firebase config
   const firebaseConfig = {
    apiKey: "AIzaSyDHDjHrnQ2IwwetQoV6cWAGnkMzANerVDE",
    authDomain: "yangerila-studio.firebaseapp.com",
    projectId: "yangerila-studio",
    storageBucket: "yangerila-studio.firebasestorage.app",
    messagingSenderId: "585529190595",
    appId: "1:585529190595:web:7555d8334949c3b30f9a76",
    measurementId: "G-39S037X9BB"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // UI refs
    const emailEl = document.querySelector('#user-email');
    const listEl  = document.querySelector('#post-list');
    const searchEl= document.querySelector('#search');

    const titleEl = document.querySelector('#title');
    const tagsEl  = document.querySelector('#tags');
    const shortEl = document.querySelector('#shortText');
    const imgUrlEl= document.querySelector('#imageUrl');
    const imgFileEl = document.querySelector('#imageFile');
    const uploadCoverBtn = document.querySelector('#uploadCover');
    const imgPrev = document.querySelector('#imagePreview');
    const tagsDisplay = document.querySelector('#tagsDisplay');

    const newBtn  = document.querySelector('#new-post');
    const saveDraftBtn = document.querySelector('#save-draft');
    const publishBtn = document.querySelector('#publish');
    const unpublishBtn = document.querySelector('#unpublish');
    const deleteBtn  = document.querySelector('#delete-post');
    const publishedEl = document.querySelector('#published');

    const previewBtn = document.querySelector('#preview');
    const previewModal = document.querySelector('#previewModal');
    const closePreview = document.querySelector('#closePreview');
    const pvTitle = document.querySelector('#pvTitle');
    const pvCover = document.querySelector('#pvCover');
    const pvTags  = document.querySelector('#pvTags');
    const pvBody  = document.querySelector('#pvBody');

    let currentId = null;
    let postsCache = [];

    // --- Enhanced Quill init with more features
    const toolbarOptions = [
      [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
      [{ 'font': [] }],
      [{ 'size': ['small', false, 'large', 'huge'] }],
      ['bold', 'italic', 'underline', 'strike'],
      [{ 'color': [] }, { 'background': [] }],
      [{ 'script': 'sub'}, { 'script': 'super' }],
      [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'list': 'check' }],
      [{ 'indent': '-1'}, { 'indent': '+1' }],
      [{ 'direction': 'rtl' }],
      [{ 'align': [] }],
      ['blockquote', 'code-block'],
      ['link', 'image', 'video'],
      ['clean']
    ];
    
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: { 
        toolbar: toolbarOptions
      },
      placeholder: 'Start writing your post...'
    });

    // Custom image handler: upload to Storage then insert
    const toolbar = quill.getModule('toolbar');
    toolbar.addHandler('image', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const path = `blogs/editor/${Date.now()}_${file.name}`;
          const ref  = sRef(storage, path);
          await uploadBytes(ref, file);
          const url = await getDownloadURL(ref);
          const range = quill.getSelection(true);
          quill.insertEmbed(range.index, 'image', url, 'user');
          quill.setSelection(range.index + 1);
        } catch (e) {
          console.error('Image upload failed', e);
          alert('Image upload failed.');
        }
      };
      input.click();
    });

    // --- Auth / admin gate
    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace('/login/');
      emailEl.textContent = user.email || '';
      const adminSnap = await getDoc(doc(db, 'admins', user.uid));
      if (!adminSnap.exists()) {
        await signOut(auth);
        return location.replace('/login/?unauthorized=1');
      }
      await loadList();
      wireEvents();
    });

    function wireEvents(){
      newBtn.addEventListener('click', () => loadForm(null));
      saveDraftBtn.addEventListener('click', () => onSave({ publish:false }));
      publishBtn.addEventListener('click', () => onSave({ publish:true }));
      unpublishBtn.addEventListener('click', () => onSave({ publish:false, forceUnpublish:true }));
      deleteBtn.addEventListener('click', onDelete);

      imgUrlEl.addEventListener('input', syncCoverPreview);
      uploadCoverBtn.addEventListener('click', uploadCover);
      tagsEl.addEventListener('input', updateTagsDisplay);

      searchEl.addEventListener('input', () => renderList(filterPosts(searchEl.value)));

      previewBtn.addEventListener('click', openPreview);
      closePreview.addEventListener('click', () => previewModal.classList.remove('open'));
      previewModal.addEventListener('click', (e) => { if (e.target === previewModal) previewModal.classList.remove('open'); });
    }

    function syncCoverPreview(){
      const url = imgUrlEl.value.trim();
      if (url){ imgPrev.src = url; imgPrev.style.display = 'block'; }
      else { imgPrev.removeAttribute('src'); imgPrev.style.display='none'; }
    }

    function updateTagsDisplay(){
      const tags = tagsEl.value.split(',').map(s => s.trim()).filter(Boolean);
      tagsDisplay.innerHTML = tags.map(t => `<span class="tag-pill">${esc(t)}</span>`).join('');
    }

    async function uploadCover(){
      const f = imgFileEl.files && imgFileEl.files[0];
      if (!f) return alert('Choose an image file first.');
      try{
        const path = `blogs/covers/${Date.now()}_${f.name}`;
        const ref  = sRef(storage, path);
        await uploadBytes(ref, f);
        const url = await getDownloadURL(ref);
        imgUrlEl.value = url;
        syncCoverPreview();
      }catch(e){
        console.error(e);
        alert('Cover upload failed.');
      }
    }

    function filterPosts(q){
      if (!q) return postsCache;
      const s = q.toLowerCase();
      return postsCache.filter(p => (p.title||'').toLowerCase().includes(s));
    }

    async function loadList(){
      listEl.innerHTML = '<div style="padding:16px; color:var(--muted); text-align:center;">Loading...</div>';
      try{
        const snap = await getDocs(collection(db, 'blogs'));
        postsCache = [];
        snap.forEach(d => postsCache.push({ id:d.id, ...d.data() }));
        postsCache.sort((a,b)=>{
          const ap = !!a.published, bp = !!b.published;
          if (ap !== bp) return ap ? -1 : 1;
          const at = (a.publishedAt?.seconds || a.updatedAt?.seconds || 0);
          const bt = (b.publishedAt?.seconds || b.updatedAt?.seconds || 0);
          return bt - at;
        });
        renderList(postsCache);
        if (postsCache.length) select(postsCache[0].id);
        else loadForm(null);
      }catch(e){
        console.error(e);
        listEl.innerHTML = '<div style="padding:16px; color:var(--error);">Failed to load posts</div>';
      }
    }

    function renderList(items){
      if (!items.length) {
        listEl.innerHTML = '<div style="padding:16px; color:var(--muted); text-align:center;">No posts yet</div>';
        return;
      }
      listEl.innerHTML = items.map(p => `
        <div class="post-item" data-id="${p.id}">
          ${p.imageUrl ? `<img class="post-thumb" src="${esc(p.imageUrl)}" onerror="this.style.display='none'"/>` : '<div class="post-thumb"></div>'}
          <div class="post-info">
            <strong>${esc(p.title || 'Untitled')}</strong>
            <small>${p.published ? 'Published' : 'Draft'}${p.publishedAt ? ' • ' + new Date(p.publishedAt.seconds*1000).toLocaleDateString() : ''}</small>
          </div>
        </div>
      `).join('');
      listEl.querySelectorAll('.post-item').forEach(el => {
        el.addEventListener('click', () => select(el.getAttribute('data-id')));
      });
      highlightSelection();
    }

    function select(id){
      const p = postsCache.find(x => x.id === id);
      if (!p) return;
      currentId = id;
      loadForm(p);
      highlightSelection();
    }

    function highlightSelection(){
      listEl.querySelectorAll('.post-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-id') === currentId);
      });
    }

    function loadForm(p){
      currentId = p ? p.id : null;
      titleEl.value = p?.title || '';
      tagsEl.value  = (p?.tags || []).join(', ');
      shortEl.value = p?.shortText || '';
      imgUrlEl.value= p?.imageUrl || '';
      publishedEl.checked = !!p?.published;

      syncCoverPreview();
      updateTagsDisplay();

      // Load HTML into Quill
      quill.setContents([]);
      if (p?.bodyHtml) {
        quill.root.innerHTML = p.bodyHtml;
      } else if (p?.fullText) {
        quill.setText(p.fullText);
      }
    }

    function openPreview(){
      pvTitle.textContent = titleEl.value.trim() || 'Untitled';
      const url = imgUrlEl.value.trim();
      if (url){ pvCover.src = url; pvCover.style.display = 'block'; } else { pvCover.style.display = 'none'; }
      
      const tags = tagsEl.value.split(',').map(s=>s.trim()).filter(Boolean);
      pvTags.innerHTML = tags.map(t=>`<span class="tag-pill">${esc(t)}</span>`).join('');
      
      pvBody.innerHTML = quill.root.innerHTML;
      previewModal.classList.add('open');
    }

    function makeShort(html){
      const text = html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      return text.length > 220 ? text.slice(0, 220) + '…' : text;
    }

    async function onSave({ publish, forceUnpublish }){
      const payload = {
        title: titleEl.value.trim(),
        imageUrl: imgUrlEl.value.trim(),
        tags: tagsEl.value.split(',').map(s => s.trim()).filter(Boolean),
        bodyHtml: quill.root.innerHTML,
        shortText: (shortEl.value.trim() || makeShort(quill.root.innerHTML)),
        updatedAt: serverTimestamp()
      };

      let desiredPublished = publishedEl.checked;
      if (publish === true) desiredPublished = true;
      if (forceUnpublish === true) desiredPublished = false;
      payload.published = desiredPublished;
      if (desiredPublished && !currentId) payload.publishedAt = serverTimestamp();

      try{
        if (currentId){
          await updateDoc(doc(db, 'blogs', currentId), payload);
        } else {
          payload.createdAt = serverTimestamp();
          if (desiredPublished) payload.publishedAt = serverTimestamp();
          const ref = await addDoc(collection(db, 'blogs'), payload);
          currentId = ref.id;
        }
        await loadList();
        alert('Saved successfully!');
      }catch(e){
        console.error(e);
        alert('Save failed. Check rules and network.');
      }
    }

    async function onDelete(){
      if (!currentId) return alert('No post selected.');
      if (!confirm('Delete this post? This action cannot be undone.')) return;
      try{
        await deleteDoc(doc(db, 'blogs', currentId));
        currentId = null;
        await loadList();
        loadForm(null);
        alert('Post deleted successfully.');
      }catch(e){
        console.error(e);
        alert('Delete failed.');
      }
    }

    function esc(s=''){return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  </script>
</body>
</html>
