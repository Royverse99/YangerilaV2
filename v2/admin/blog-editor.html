<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Blog Editor — Yangerila Admin</title>

  <!-- Reuse your admin/login theme -->
  <link rel="stylesheet" href="/login/style.css?v=6"/>

  <!-- Quill (free) -->
  <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">

  <style>
    .editor-wrap{display:grid;grid-template-columns:320px 1fr;gap:18px}
    @media (max-width: 1024px){ .editor-wrap{grid-template-columns:1fr} }

    .panel{
      background:var(--panel);border:1px solid var(--border);
      border-radius:12px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.35)
    }
    .panel h2{margin:0 0 10px;color:var(--accent);font-size:20px}

    /* Post list */
    .post-list{display:flex;flex-direction:column;gap:8px;max-height:68vh;overflow:auto}
    .post-item{
      display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);
      border-radius:10px;cursor:pointer;background:rgba(255,255,255,0.03)
    }
    .post-item.active{outline:2px solid var(--accent)}
    .post-thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
    .post-meta{display:flex;flex-direction:column}
    .post-meta small{color:var(--muted)}

    /* Form */
    .grid{display:grid;gap:12px}
    .grid.two{grid-template-columns:1fr 1fr}
    @media (max-width:800px){ .grid.two{grid-template-columns:1fr} }
    input, textarea{width:100%}
    textarea{min-height:100px;resize:vertical}
    .row{display:flex;gap:10px;flex-wrap:wrap}

    /* Quill theme tweaks to match dark style */
    .ql-toolbar.ql-snow{
      border:1px solid var(--border);border-radius:10px 10px 0 0;background:rgba(255,255,255,.04)
    }
    .ql-container.ql-snow{
      border:1px solid var(--border);border-top:0;border-radius:0 0 10px 10px;
      background:rgba(255,255,255,.02);color:var(--text);min-height:320px
    }
    .ql-tooltip{color:#111}
    .ql-editor a{color:var(--accent);text-decoration:underline}

    /* Image preview for cover image */
    .img-preview{width:100%;max-height:240px;object-fit:cover;border-radius:10px;border:1px solid var(--border);display:none}

    /* Preview modal */
    .modal{
      position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:1000
    }
    .modal.open{display:flex}
    .modal-card{max-width:900px;width:92vw;max-height:90vh;overflow:auto;background:var(--panel);
      border:1px solid var(--border);border-radius:12px;padding:16px}
    .modal .close{position:absolute;right:20px;top:20px}
    .content p{line-height:1.65;margin:0 0 14px}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .tag{font-size:12px;background:rgba(122,231,199,0.15);border:1px solid var(--border);border-radius:8px;padding:3px 8px;color:var(--accent)}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" style="width:100%;max-width:1180px">
      <header class="head">
        <!-- Update logo path if needed -->
        <img src="/v2/wp-content/uploads/2022/04/your-logo-file-name.png" class="logo" alt="Yangerila"/>
        <h1>Blog Editor</h1>
        <p class="muted" id="user-email">Loading…</p>
        <div class="row" style="justify-content:center">
          <a class="btn" href="/admin/">← Back to Admin</a>
          <a class="btn" href="/blog/">View Public Blog</a>
          <button class="btn primary" id="new-post">New Post</button>
          <button class="btn" id="save-draft">Save Draft</button>
          <button class="btn" id="preview">Preview</button>
          <button class="btn" id="publish">Publish</button>
          <button class="btn" id="unpublish">Unpublish</button>
          <button class="btn" id="delete-post">Delete</button>
          <label class="remember"><input type="checkbox" id="published"> Published</label>
        </div>
      </header>

      <div class="editor-wrap">
        <!-- Left: list -->
        <aside class="panel">
          <h2>Posts</h2>
          <input id="search" placeholder="Search titles…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text)"/>
          <div class="post-list" id="post-list"></div>
        </aside>

        <!-- Right: form -->
        <section class="panel">
          <h2>Edit Post</h2>
          <div class="grid">
            <div class="grid two">
              <div>
                <label>Title</label>
                <input id="title" placeholder="Post title"/>
              </div>
              <div>
                <label>Tags (comma separated)</label>
                <input id="tags" placeholder="practice, technique"/>
              </div>
            </div>

            <div class="grid two">
              <div>
                <label>Cover Image URL</label>
                <input id="imageUrl" placeholder="https://…"/>
                <div class="row" style="margin-top:6px">
                  <input type="file" id="imageFile" accept="image/*"/>
                  <button class="btn" id="uploadCover">Upload to Storage</button>
                </div>
                <img id="imagePreview" class="img-preview" src="" alt=""/>
              </div>
              <div>
                <label>Short text (auto-generated if left empty)</label>
                <textarea id="shortText" placeholder="Teaser used on homepage/list…"></textarea>
              </div>
            </div>

            <div>
              <label>Content</label>
              <div id="toolbar"></div>
              <div id="editor"></div>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <!-- Preview Modal -->
  <div class="modal" id="previewModal" aria-hidden="true">
    <div class="modal-card">
      <button class="btn close" id="closePreview">Close</button>
      <h2 id="pvTitle"></h2>
      <img id="pvCover" style="width:100%;max-height:340px;object-fit:cover;border-radius:12px;border:1px solid var(--border);display:none" />
      <div class="tags" id="pvTags"></div>
      <article class="content" id="pvBody" style="margin-top:10px"></article>
    </div>
  </div>

  <!-- Firebase + Quill -->
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
    import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
    import {
      getFirestore, doc, getDoc, collection, getDocs, addDoc, updateDoc, deleteDoc,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import {
      getStorage, ref as sRef, uploadBytes, getDownloadURL
    } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js';

    // --- Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyDHDjHrnQ2IwwetQoV6cWAGnkMzANerVDE",
    authDomain: "yangerila-studio.firebaseapp.com",
    projectId: "yangerila-studio",
    storageBucket: "yangerila-studio.firebasestorage.app",
    messagingSenderId: "585529190595",
    appId: "1:585529190595:web:7555d8334949c3b30f9a76",
    measurementId: "G-39S037X9BB"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    // UI refs
    const emailEl = document.querySelector('#user-email');
    const listEl  = document.querySelector('#post-list');
    const searchEl= document.querySelector('#search');

    const titleEl = document.querySelector('#title');
    const tagsEl  = document.querySelector('#tags');
    const shortEl = document.querySelector('#shortText');
    const imgUrlEl= document.querySelector('#imageUrl');
    const imgFileEl = document.querySelector('#imageFile');
    const uploadCoverBtn = document.querySelector('#uploadCover');
    const imgPrev = document.querySelector('#imagePreview');

    const newBtn  = document.querySelector('#new-post');
    const saveDraftBtn = document.querySelector('#save-draft');
    const publishBtn = document.querySelector('#publish');
    const unpublishBtn = document.querySelector('#unpublish');
    const deleteBtn  = document.querySelector('#delete-post');
    const publishedEl = document.querySelector('#published');

    const previewBtn = document.querySelector('#preview');
    const previewModal = document.querySelector('#previewModal');
    const closePreview = document.querySelector('#closePreview');
    const pvTitle = document.querySelector('#pvTitle');
    const pvCover = document.querySelector('#pvCover');
    const pvTags  = document.querySelector('#pvTags');
    const pvBody  = document.querySelector('#pvBody');

    let currentId = null;
    let postsCache = [];

    // --- Quill init
    const toolbarOptions = [
      [{ 'header': [1, 2, 3, false] }],
      ['bold', 'italic', 'underline', 'strike'],
      [{ 'list': 'ordered'}, { 'list': 'bullet' }],
      [{ 'align': [] }],
      ['link', 'image', 'blockquote', 'code-block'],
      ['clean']
    ];
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: { toolbar: toolbarOptions }
    });

    // custom image handler: upload to Storage then insert
    const toolbar = quill.getModule('toolbar');
    toolbar.addHandler('image', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const path = `blogs/editor/${Date.now()}_${file.name}`;
          const ref  = sRef(storage, path);
          await uploadBytes(ref, file);
          const url = await getDownloadURL(ref);
          const range = quill.getSelection(true);
          quill.insertEmbed(range.index, 'image', url, 'user');
          quill.setSelection(range.index + 1);
        } catch (e) {
          console.error('Image upload failed', e);
          alert('Image upload failed.');
        }
      };
      input.click();
    });

    // --- Auth / admin gate
    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.replace('/login/');
      emailEl.textContent = user.email || '';
      const adminSnap = await getDoc(doc(db, 'admins', user.uid));
      if (!adminSnap.exists()) {
        await signOut(auth);
        return location.replace('/login/?unauthorized=1');
      }
      await loadList();
      wireEvents();
    });

    function wireEvents(){
      newBtn.addEventListener('click', () => loadForm(null));
      saveDraftBtn.addEventListener('click', () => onSave({ publish:false }));
      publishBtn.addEventListener('click', () => onSave({ publish:true }));
      unpublishBtn.addEventListener('click', () => onSave({ publish:false, forceUnpublish:true }));
      deleteBtn.addEventListener('click', onDelete);

      imgUrlEl.addEventListener('input', syncCoverPreview);
      uploadCoverBtn.addEventListener('click', uploadCover);

      searchEl.addEventListener('input', () => renderList(filterPosts(searchEl.value)));

      previewBtn.addEventListener('click', openPreview);
      closePreview.addEventListener('click', () => previewModal.classList.remove('open'));
      previewModal.addEventListener('click', (e) => { if (e.target === previewModal) previewModal.classList.remove('open'); });
    }

    function syncCoverPreview(){
      const url = imgUrlEl.value.trim();
      if (url){ imgPrev.src = url; imgPrev.style.display = 'block'; }
      else { imgPrev.removeAttribute('src'); imgPrev.style.display='none'; }
    }

    async function uploadCover(){
      const f = imgFileEl.files && imgFileEl.files[0];
      if (!f) return alert('Choose an image file first.');
      try{
        const path = `blogs/covers/${Date.now()}_${f.name}`;
        const ref  = sRef(storage, path);
        await uploadBytes(ref, f);
        const url = await getDownloadURL(ref);
        imgUrlEl.value = url;
        syncCoverPreview();
      }catch(e){
        console.error(e);
        alert('Cover upload failed.');
      }
    }

    function filterPosts(q){
      if (!q) return postsCache;
      const s = q.toLowerCase();
      return postsCache.filter(p => (p.title||'').toLowerCase().includes(s));
    }

    async function loadList(){
      listEl.innerHTML = '<div class="muted">Loading…</div>';
      try{
        const snap = await getDocs(collection(db, 'blogs')); // simple, no index needed
        postsCache = [];
        snap.forEach(d => postsCache.push({ id:d.id, ...d.data() }));
        // sort: published first by publishedAt desc, then drafts by updatedAt desc
        postsCache.sort((a,b)=>{
          const ap = !!a.published, bp = !!b.published;
          if (ap !== bp) return ap ? -1 : 1;
          const at = (a.publishedAt?.seconds || a.updatedAt?.seconds || 0);
          const bt = (b.publishedAt?.seconds || b.updatedAt?.seconds || 0);
          return bt - at;
        });
        renderList(postsCache);
        if (postsCache.length) select(postsCache[0].id);
        else loadForm(null);
      }catch(e){
        console.error(e);
        listEl.innerHTML = '<div class="err">Failed to load posts</div>';
      }
    }

    function renderList(items){
      listEl.innerHTML = items.map(p => `
        <div class="post-item" data-id="${p.id}">
          ${p.imageUrl ? `<img class="post-thumb" src="${esc(p.imageUrl)}" onerror="this.style.display='none'"/>` : '<div class="post-thumb" style="display:none"></div>'}
          <div class="post-meta">
            <strong>${esc(p.title || 'Untitled')}</strong>
            <small>${p.published ? 'Published' : 'Draft'}${p.publishedAt ? ' · ' + new Date(p.publishedAt.seconds*1000).toLocaleDateString() : ''}</small>
          </div>
        </div>
      `).join('');
      listEl.querySelectorAll('.post-item').forEach(el => {
        el.addEventListener('click', () => select(el.getAttribute('data-id')));
      });
      highlightSelection();
    }

    function select(id){
      const p = postsCache.find(x => x.id === id);
      if (!p) return;
      currentId = id;
      loadForm(p);
      highlightSelection();
    }

    function highlightSelection(){
      listEl.querySelectorAll('.post-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-id') === currentId);
      });
    }

    function loadForm(p){
      currentId = p ? p.id : null;
      titleEl.value = p?.title || '';
      tagsEl.value  = (p?.tags || []).join(', ');
      shortEl.value = p?.shortText || '';
      imgUrlEl.value= p?.imageUrl || '';
      publishedEl.checked = !!p?.published;

      syncCoverPreview();

      // load HTML into Quill
      quill.setContents([]); // clear
      if (p?.bodyHtml) {
        quill.root.innerHTML = p.bodyHtml; // safe because only admins edit
      } else if (p?.fullText) {
        // backward compat: plain text from older version
        quill.setText(p.fullText);
      }
    }

    function openPreview(){
      pvTitle.textContent = titleEl.value.trim() || 'Untitled';
      const url = imgUrlEl.value.trim();
      if (url){ pvCover.src = url; pvCover.style.display = 'block'; } else { pvCover.style.display = 'none'; }
      pvTags.innerHTML = tagsEl.value.split(',').map(s=>s.trim()).filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
      pvBody.innerHTML = quill.root.innerHTML;
      previewModal.classList.add('open');
    }

    function makeShort(html){
      const text = html.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      return text.length > 220 ? text.slice(0, 220) + '…' : text;
    }

    async function onSave({ publish, forceUnpublish }){
      const payload = {
        title: titleEl.value.trim(),
        imageUrl: imgUrlEl.value.trim(),
        tags: tagsEl.value.split(',').map(s => s.trim()).filter(Boolean),
        bodyHtml: quill.root.innerHTML,
        shortText: (shortEl.value.trim() || makeShort(quill.root.innerHTML)),
        updatedAt: serverTimestamp()
      };

      let desiredPublished = publishedEl.checked;
      if (publish === true) desiredPublished = true;
      if (forceUnpublish === true) desiredPublished = false;
      payload.published = desiredPublished;
      if (desiredPublished && !currentId) payload.publishedAt = serverTimestamp();

      try{
        if (currentId){
          await updateDoc(doc(db, 'blogs', currentId), payload);
        } else {
          payload.createdAt = serverTimestamp();
          if (desiredPublished) payload.publishedAt = serverTimestamp();
          const ref = await addDoc(collection(db, 'blogs'), payload);
          currentId = ref.id;
        }
        await loadList();
        alert('Saved.');
      }catch(e){
        console.error(e);
        alert('Save failed. Check rules and network.');
      }
    }

    async function onDelete(){
      if (!currentId) return alert('No post selected.');
      if (!confirm('Delete this post?')) return;
      try{
        await deleteDoc(doc(db, 'blogs', currentId));
        currentId = null;
        await loadList();
        loadForm(null);
        alert('Deleted.');
      }catch(e){
        console.error(e);
        alert('Delete failed.');
      }
    }

    function esc(s=''){return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  </script>
</body>
</html>
